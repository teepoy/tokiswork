[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tokiswork"
version = "0.1.0"
description = "Minimal DSPy CSV prompt pipeline with sandboxed Polars execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy>=2.6.0",
    "gradio>=5.23.0,<6",
    "polars>=1.30.0",
    "python-pptx>=0.6.23",
    "httpx>=0.25.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tokiswork-dspy = "tokiswork_dspy.pipeline:run_cli"
tokiswork-gradio = "tokiswork_dspy.gradio_app:launch_cli"
tokiswork-pptx = "tokiswork_dspy.pptx_cli:run_cli"
tokiswork-pptx-chat = "tokiswork_dspy.pptx_chat:run_chat_cli"
tokiswork-gradio-oauth = "tokiswork_oauth.cli:launch_oauth_cli"
tokiswork-supcon-demo = "tokiswork_supcon.demo:run_demo"

[tool.hatch.build.targets.wheel]
packages = ["src/tokiswork_dspy", "src/tokiswork_oauth", "src/tokiswork_triplets", "src/tokiswork_supcon"]
